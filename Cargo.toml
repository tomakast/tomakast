[workspace]
resolver = "3"
members = ["crates/core", "crates/ui", "crates/platform", "crates/app", "modules/apps"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
# internal crates
tomakast-core = { path = "crates/core" }
tomakast-ui = { path = "crates/ui" }
tomakast-platform = { path = "crates/platform" }
tomakast-module-apps = { path = "modules/apps" }

# GPUI (pinned exactly; pulls in gpui-pre =0.3.12)
gpui-kit = "=0.10.0"

nucleo-matcher = "0.3"
rusqlite = { version = "0.43", features = ["bundled"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
async-channel = "2.5"
interprocess = "2.4"
ashpd = { version = "0.13", default-features = false, features = ["async-io", "global_shortcuts"] }
freedesktop-desktop-entry = "0.8"
freedesktop-icons = "0.4"
notify = "8"
directories = "6"
toml = "1"
serde = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
bitflags = "2"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
