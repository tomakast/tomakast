[workspace]
resolver = "3"
members = ["crates/core", "crates/ui", "crates/raster", "crates/platform", "crates/app", "crates/plugin-api", "crates/plugin-host", "crates/location", "crates/places", "modules/apps", "modules/demo", "modules/files", "modules/history", "modules/home", "modules/settings"]
# Crates under experiments/ and plugins/, and the guest SDK crates/plugin-sdk (built for
# wasm32-wasip2 with the plugins), are not members. Each opts out with its own empty
# `[workspace]` table: `exclude` takes path prefixes, not globs, and in a nested git worktree
# Cargo would otherwise keep walking up to the main checkout's workspace.
# Vendored, patched dependencies live under third_party/ (see each one's TOMAKAST.md).
exclude = ["third_party"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
# internal crates
tomakast-core = { path = "crates/core" }
tomakast-ui = { path = "crates/ui" }
tomakast-raster = { path = "crates/raster" }
tomakast-platform = { path = "crates/platform" }
tomakast-location = { path = "crates/location" }
tomakast-places = { path = "crates/places" }
tomakast-plugin-host = { path = "crates/plugin-host" }
tomakast-module-apps = { path = "modules/apps" }
tomakast-module-demo = { path = "modules/demo" }
tomakast-module-files = { path = "modules/files" }
tomakast-module-history = { path = "modules/history" }
tomakast-module-home = { path = "modules/home" }
tomakast-module-settings = { path = "modules/settings" }

# GPUI (pinned exactly; pulls in gpui-pre =0.3.12)
gpui-kit = "=0.10.0"

nucleo-matcher = "0.3"
rusqlite = { version = "0.43", features = ["bundled"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4", "v5"] }
async-channel = "2.5"
interprocess = "2.4"
ashpd = { version = "0.13", default-features = false, features = ["async-io", "global_shortcuts"] }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
freedesktop-desktop-entry = "0.8"
freedesktop-icons = "0.4"
notify = "8"
directories = "6"
toml = "1"
toml_edit = "0.25"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
bitflags = "2"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
libc = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
wit-parser = "0.261"
# Sync wasmtime, Cranelift and the component model. No GC, cache, wat, profiling or
# component-model-async. `wasmtime-wasi`'s `p2` feature enables `wasmtime/async` itself.
wasmtime = { version = "50", default-features = false, features = ["runtime", "std", "anyhow", "component-model", "cranelift", "parallel-compilation"] }
wasmtime-wasi = { version = "50", default-features = false, features = ["p2"] }
pulldown-cmark = { version = "0.13", default-features = false }
# Plugin HTTP: rustls with the bundled webpki roots; no gzip (the body cap stays a byte cap),
# no cookies, no JSON.
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
url = "2.5"
# File search: the walker with .gitignore support, name globs, the item and thumbnail hashes.
ignore = "0.4"
globset = "0.4"
md-5 = "0.10"
# File search: the parallel scan of the index.
rayon = "1.12"

# The Wayland layer-shell surface size with a client inset; see third_party/gpui-pre-linux/TOMAKAST.md.
[patch.crates-io]
gpui-pre-linux = { path = "third_party/gpui-pre-linux" }

# The everyday build (`just`, `cargo test`). Measured on a 16-thread machine against the
# default dev profile: a clean app build 80 s -> 69 s, a rebuild after a change in core or ui
# 5.8 s -> 3.6 s, and a third of the disk (target 24 GB -> 8 GB). Line tables keep file:line
# in backtraces; nobody steps through a debugger here.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Cranelift compiles each plugin's wasm (the host tests compile them again in every test
# binary). Unoptimized it is several times slower: the plugin-host tests took 69 s instead of
# 36 s. Optimizing these crates costs about 20 s once per clean build.
[profile.dev.package.cranelift-codegen]
opt-level = 3
[profile.dev.package.cranelift-frontend]
opt-level = 3
[profile.dev.package.cranelift-bforest]
opt-level = 3
[profile.dev.package.cranelift-entity]
opt-level = 3
[profile.dev.package.cranelift-assembler-x64]
opt-level = 3
[profile.dev.package.regalloc2]
opt-level = 3
[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 3

# GPUI's layout, text and paint, and the text shaping and glyph rasterising under it.
# Unoptimized, a frame of the settings window's Hotkeys page (130 applications) took 10-12 ms
# in the settings_perf bench and the window's first frame 89-97 ms; with these, 2 ms and
# 24 ms (the text crates' part of it: 77 ms without them). The wgpu and naga crates made no
# measurable difference to that first frame, so they stay out (GPUI's own wgpu renderer,
# gpui-pre-wgpu, is in). A clean app build takes about 20 s longer
# on 16 threads (68 s -> 90 s; CPU time 625 s -> 1028 s); rebuilds after a change in the
# workspace's own crates are unaffected.
[profile.dev.package.gpui-pre]
opt-level = 2
[profile.dev.package.gpui-pre-linux]
opt-level = 2
[profile.dev.package.gpui-pre-platform]
opt-level = 2
[profile.dev.package.gpui-pre-wgpu]
opt-level = 2
[profile.dev.package.gpui-pre-sum-tree]
opt-level = 2
[profile.dev.package.gpui-pre-collections]
opt-level = 2
[profile.dev.package.gpui-pre-util]
opt-level = 2
[profile.dev.package.gpui-pre-refineable]
opt-level = 2
[profile.dev.package.gpui-pre-shared-string]
opt-level = 2
[profile.dev.package.gpui-pre-scheduler]
opt-level = 2
[profile.dev.package.gpui-base]
opt-level = 2
[profile.dev.package.gpui-component]
opt-level = 2
[profile.dev.package.gpui-kit]
opt-level = 2
[profile.dev.package.taffy]
opt-level = 2
[profile.dev.package.cosmic-text]
opt-level = 2
[profile.dev.package.harfrust]
opt-level = 2
[profile.dev.package.swash]
opt-level = 2
[profile.dev.package.zeno]
opt-level = 2
[profile.dev.package.skrifa]
opt-level = 2
[profile.dev.package.read-fonts]
opt-level = 2
[profile.dev.package.font-types]
opt-level = 2
