[package]
name = "translator"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# Not a member of the tomakast workspace (see the root Cargo.toml).
[workspace]

# `cdylib` is the plugin; `rlib` lets the pure logic build and test on the host target.
[lib]
crate-type = ["cdylib", "rlib"]

# No parser crates (JSON is read by hand), so the wasm stays small.
[dependencies]
tomakast-plugin = { path = "../../crates/plugin-sdk" }

# The launcher's markdown parser, to check natively that escaped text renders as written.
[dev-dependencies]
pulldown-cmark = { version = "=0.13.6", default-features = false }

# The everyday build (`just`, the host tests). Without debug info the wasm is 5 to 10 times
# smaller, and size-optimized code builds as fast as unoptimized code here, yet the launcher
# compiles it about 5 times faster than an `opt-level = 1` build. No LTO: that is the slow part
# of the release build.
[profile.dev]
opt-level = "s"
debug = false

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
