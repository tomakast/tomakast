id = "calc"
name = "Calculator"
version = "0.1.0"
api = "0.1.0"

[[commands]]
id = "calculator"
title = "Calculator"
icon = "calculator"

[[commands]]
id = "history"
title = "Calculator History"
icon = "file-clock"

[permissions]
