id = "weather"
name = "Weather"
version = "0.1.0"
api = "0.1.0"

[[commands]]
id = "refresh"
title = "Refresh Weather"
icon = "cloud-sun"

[[preferences]]
key = "city"
title = "City: auto for where this computer is, a name such as Berlin or Москва, or 52.52, 13.41"
kind = "text"
default = "auto"

[[preferences]]
key = "fahrenheit"
title = "Show °F and mph instead of °C and km/h"
kind = "bool"
default = "false"

[permissions]
location = true
search = true
clipboard = true
storage = true
timers = true
http = ["api.open-meteo.com", "geocoding-api.open-meteo.com"]

[[widgets]]
id = "now"
title = "Weather now"
size = "quarter"

[[widgets]]
id = "today"
title = "Weather today"
size = "single"

[[widgets]]
id = "city"
title = "Weather in a city you search for"
size = "quarter"
