id = "weather"
name = "Weather"
version = "0.1.0"
api = "0.1.0"

[[commands]]
id = "refresh"
title = "Refresh Weather"
icon = "cloud-sun"

[[preferences]]
key = "temperature"
title = "Temperature"
kind = "choice"
default = "celsius"
options = [{ value = "celsius", title = "°C" }, { value = "fahrenheit", title = "°F" }]

[[preferences]]
key = "wind"
title = "Wind speed"
kind = "choice"
default = "kmh"
options = [{ value = "kmh", title = "km/h" }, { value = "ms", title = "m/s" }, { value = "mph", title = "mph" }, { value = "kn", title = "knots" }]

[[preferences]]
key = "pressure"
title = "Pressure"
kind = "choice"
default = "hpa"
options = [{ value = "hpa", title = "hPa" }, { value = "mmhg", title = "mm Hg" }]

[permissions]
location = true
search = true
clipboard = true
storage = true
timers = true
http = [
    "api.open-meteo.com",
    "geocoding-api.open-meteo.com",
    "air-quality-api.open-meteo.com",
]

[[widgets]]
id = "now"
title = "Weather now"
sizes = ["quarter", "single"]

[[widgets.params]]
key = "city"
title = "City"

[[widgets]]
id = "today"
title = "Weather today"
sizes = ["quarter", "single", "double"]

[[widgets.params]]
key = "city"
title = "City"

[[widgets]]
id = "humidity"
title = "Humidity"
sizes = ["quarter", "single"]

[[widgets.params]]
key = "city"
title = "City"

[[widgets]]
id = "wind"
title = "Wind"
sizes = ["quarter", "single"]

[[widgets.params]]
key = "city"
title = "City"

[[widgets]]
id = "uv"
title = "UV index"
sizes = ["quarter", "single"]

[[widgets.params]]
key = "city"
title = "City"

[[widgets]]
id = "pressure"
title = "Pressure"
sizes = ["quarter", "single"]

[[widgets.params]]
key = "city"
title = "City"

[[widgets]]
id = "precipitation"
title = "Rain"
sizes = ["quarter", "single"]

[[widgets.params]]
key = "city"
title = "City"

[[widgets]]
id = "air-quality"
title = "Air quality"
sizes = ["quarter", "single"]

[[widgets.params]]
key = "city"
title = "City"

[[widgets]]
id = "pollen"
title = "Pollen"
sizes = ["quarter", "single"]

[[widgets.params]]
key = "city"
title = "City"

[[widgets]]
id = "daylight"
title = "Daylight"
sizes = ["quarter", "single"]

[[widgets.params]]
key = "city"
title = "City"
