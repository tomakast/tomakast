id = "weather"
name = "Weather"
version = "0.1.0"
api = "0.1.0"

[[commands]]
id = "refresh"
title = "Refresh Weather"
icon = "cloud-sun"

[[preferences]]
key = "fahrenheit"
title = "Show °F and mph instead of °C and km/h"
kind = "bool"
default = "false"

[permissions]
location = true
search = true
clipboard = true
storage = true
timers = true
http = ["api.open-meteo.com", "geocoding-api.open-meteo.com"]

[[widgets]]
id = "now"
title = "Weather now"
sizes = ["quarter", "single"]

[[widgets.params]]
key = "city"
title = "City"

[[widgets]]
id = "today"
title = "Weather today"
sizes = ["single"]

[[widgets.params]]
key = "city"
title = "City"
