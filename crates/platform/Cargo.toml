[package]
name = "tomakast-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
tomakast-core.workspace = true
anyhow.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# Same major as gpui's own ashpd (0.13), so there is one zbus stack; with the Settings portal,
# for the reduced-motion setting.
ashpd = { workspace = true, features = ["settings"] }
# kglobalaccel, KDE's shortcut service.
zbus.workspace = true
async-io = "2"
futures-util = { version = "0.3", default-features = false }
freedesktop-icons.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
# macOS `RegisterEventHotKey`, Windows `RegisterHotKey`, X11 `XGrabKey`.
global-hotkey = "0.10"

[dev-dependencies]
tempfile.workspace = true
