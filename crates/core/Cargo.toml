[package]
name = "tomakast-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true


[dependencies]
nucleo-matcher.workspace = true
chrono.workspace = true
uuid.workspace = true
rusqlite.workspace = true
anyhow.workspace = true
async-channel.workspace = true
tracing.workspace = true
serde.workspace = true
toml.workspace = true
toml_edit.workspace = true
bitflags.workspace = true
directories.workspace = true
thiserror.workspace = true
url.workspace = true

[target.'cfg(unix)'.dependencies]
# The worker thread's CPU time, which the soft render deadline is measured in.
libc.workspace = true

[features]
# In-crate test doubles (FakeModule), reused by other crates' tests.
testing = []

[dev-dependencies]
tempfile.workspace = true
wit-parser.workspace = true
# Enables the `testing` feature for this crate's own integration tests.
tomakast-core = { path = ".", features = ["testing"] }
