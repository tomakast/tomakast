name: CI

on:
  push:
    branches: [main]
  pull_request:
  # macOS and Windows run only from here (Actions tab -> CI -> Run workflow).
  workflow_dispatch:
    inputs:
      os:
        description: Runners to use
        type: choice
        default: all
        options: [all, macos, windows, ubuntu]

env:
  CARGO_TERM_COLOR: always
  # Debug info for gpui and wasmtime fills the runner's disk during `cargo test`.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Push and pull requests: Linux only. Manual runs: the chosen runners.
        os: >-
          ${{ github.event_name != 'workflow_dispatch' && fromJSON('["ubuntu-latest"]')
          || inputs.os == 'all' && fromJSON('["ubuntu-latest","macos-latest","windows-latest"]')
          || fromJSON(format('["{0}-latest"]', inputs.os)) }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-dev libwayland-dev libvulkan-dev libfontconfig-dev libx11-xcb-dev libxcb1-dev clang
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
