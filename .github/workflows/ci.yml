name: CI

on:
  push:
    branches: [main]
  pull_request:
  # macOS and Windows run only from here (Actions tab -> CI -> Run workflow).
  workflow_dispatch:
    inputs:
      os:
        description: Runners to use
        type: choice
        default: all
        options: [all, macos, windows, ubuntu]

env:
  CARGO_TERM_COLOR: always
  # Debug info for gpui and wasmtime fills the runner's disk during `cargo test`.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Push and pull requests: Linux only. Manual runs: the chosen runners.
        os: >-
          ${{ github.event_name != 'workflow_dispatch' && fromJSON('["ubuntu-latest"]')
          || inputs.os == 'all' && fromJSON('["ubuntu-latest","macos-latest","windows-latest"]')
          || fromJSON(format('["{0}-latest"]', inputs.os)) }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-dev libwayland-dev libvulkan-dev libfontconfig-dev libx11-xcb-dev libxcb1-dev clang
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98"
          components: rustfmt, clippy
          targets: wasm32-wasip2, aarch64-apple-darwin, x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # `--all-targets` turns on plugin-host's `testing` feature (its tests dev-depend on it);
      # this checks the production configuration, without the test-only recorder.
      - run: cargo clippy -p tomakast-plugin-host --lib -- -D warnings
      - run: cargo test --workspace
      # The location backends of the other OSes, type-checked from Linux (they need no SDK).
      - name: Location backends (macOS and Windows targets)
        if: runner.os == 'Linux'
        run: |
          cargo clippy -p tomakast-location --all-targets --target aarch64-apple-darwin -- -D warnings
          cargo clippy -p tomakast-location --all-targets --target x86_64-pc-windows-gnu -- -D warnings
      # The guest crates are not workspace members (they target wasm32-wasip2), so the steps
      # above do not check them. They share target/plugins with the host tests' guest builds.
      # `shell: bash` so that the first failing command fails the step on Windows too.
      - name: Guest SDK (crates/plugin-sdk)
        shell: bash
        env:
          CARGO_TARGET_DIR: target/plugins
        run: |
          cargo fmt --check --manifest-path crates/plugin-sdk/Cargo.toml
          cargo clippy --manifest-path crates/plugin-sdk/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path crates/plugin-sdk/Cargo.toml --all-targets --target wasm32-wasip2 -- -D warnings
          cargo test --manifest-path crates/plugin-sdk/Cargo.toml
      - name: kitchen-sink plugin
        shell: bash
        env:
          CARGO_TARGET_DIR: target/plugins
        run: |
          cargo fmt --check --manifest-path plugins/kitchen-sink/Cargo.toml
          cargo clippy --manifest-path plugins/kitchen-sink/Cargo.toml --all-targets --target wasm32-wasip2 -- -D warnings
      # Its engine tests run natively, in release for the timing tests.
      - name: calc plugin
        shell: bash
        env:
          CARGO_TARGET_DIR: target/plugins
        run: |
          cargo fmt --check --manifest-path plugins/calc/Cargo.toml
          cargo clippy --manifest-path plugins/calc/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path plugins/calc/Cargo.toml --all-targets --target wasm32-wasip2 -- -D warnings
          cargo test --release --manifest-path plugins/calc/Cargo.toml
      # Its state machine, parsers and tiles are tested natively against saved Open-Meteo
      # answers; the host tests drive the wasm with the network faked.
      - name: weather plugin
        shell: bash
        env:
          CARGO_TARGET_DIR: target/plugins
        run: |
          cargo fmt --check --manifest-path plugins/weather/Cargo.toml
          cargo clippy --manifest-path plugins/weather/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path plugins/weather/Cargo.toml --all-targets --target wasm32-wasip2 -- -D warnings
          cargo test --manifest-path plugins/weather/Cargo.toml
